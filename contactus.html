  <!-- External CSS -->
  <link rel="stylesheet" href="style/style.css" />

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- JavaScript -->
  <script src="script/script.js" defer></script>

  <style>
    .nav-gold {
  color: #fbc02d !important;
  font-weight: 600;
}

.nav-gold:hover {
  color: #fff176 !important;
  text-decoration: underline;
}

.nav-white {
  color: white !important;
}

.login-btn {
  background-color: transparent;
  border: 2px solid white;
  padding: 6px 14px;
  border-radius: 6px;
  font-weight: bold;
  margin-left: 20px;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.login-btn:hover {
  background-color: #ffffff;
  color: #4A148C !important;
}
.navbar-nav .nav-link {
  margin: 0 10px; /* You can increase to 12px or 15px if needed */
}


    
    .hero {
  background-image: url(images/contact-us-banner.png);
  background-size: cover;
  background-position: center;
  padding: 100px 20px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.hero::before {
  content: "";
  background-color: rgba(255, 255, 255, 0.4); /* soft white fade */
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.hero-content {
  position: relative;
  z-index: 2;
  background-color: rgba(255, 255, 255, 0.65);
  padding: 20px;
  border-radius: 10px;
  display: inline-block;
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

.hero h1,
.hero p {
  color: #2c003e; /* Strong deep purple */
  font-weight: 600;
}


    .tagline {
      font-size: 1.2rem;
      color: lavender;
      margin-top: 10px;
    }

    .confirmation {
      display: none;
      margin-top: 20px;
      color: green;
      font-weight: bold;
    }
 /* Centered "Contact Us" heading in hero */
 .hero h1 {
  color: #d81860;
  font-weight: 700;
  text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.4);
}

.hero p {
  color: #FDD835;
  font-size: 1.1rem;
  font-weight: 500;
  text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
}

}

  </style>
</head>

<body>
 <!-- Navbar -->
<header class="navbar sticky-top" style="background-color: #4A148C;">
  <div class="container d-flex justify-content-center align-items-center flex-wrap py-2">
    <nav class="navbar-nav d-flex flex-row flex-wrap justify-content-center w-100">
      <a class="nav-link nav-gold" href="index.html"><i class="fas fa-home"></i> Home</a>
      <a class="nav-link nav-gold" href="services.html"><i class="fas fa-clipboard-list"></i> Services</a>
      <a class="nav-link nav-gold" href="pricing.html"><i class="fas fa-tags"></i> Pricing</a>
      <a class="nav-link nav-gold" href="howitworks.html"><i class="fas fa-cogs"></i> How It Works</a>
      <a class="nav-link nav-gold" href="aboutus.html"><i class="fas fa-users"></i> About Us</a>
      <a class="nav-link nav-gold" href="blog.html"><i class="fas fa-blog"></i> Blog</a>
      <a class="nav-link nav-gold active" href="contactus.html"><i class="fas fa-envelope"></i> Contact</a>
      <a class="nav-link nav-white login-btn" href="login.html">Login/Sign Up</a>
    </nav>
  </div>
</header>

 <!-- Hero Section -->
  <section class="hero">
    <div class="content text-center">
      <h1>Contact Us</h1>
      <p>We’re here to help you connect, book, and thrive.</p>
    </div>
  </section>

  <!-- Contact Form -->
  <section class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="text-center mb-4">Send Us a Message</h2>

        <form id="contact-form" action="https://formspree.io/f/xnnpjdyq" method="POST">
          <div class="mb-3">
            <label for="name" class="form-label">Full Name:</label>
            <input type="text" name="name" id="name" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address:</label>
            <input type="email" name="email" id="email" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number (optional):</label>
            <input type="tel" name="phone" id="phone" class="form-control" />
          </div>

          <div class="mb-3">
            <label for="service" class="form-label">What type of service are you looking for?</label>
            <select name="service" id="service" class="form-select" required>
              <option value="">-- Select One --</option>
              <option value="Home Services">Home Services</option>
              <option value="Business Support">Business Support</option>
              <option value="Custom Request">Custom Request</option>
              <option value="General Inquiry">General Inquiry</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Your Message:</label>
            <textarea name="message" id="message" rows="5" class="form-control" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <!-- Confirmation Message -->
        <div id="form-confirmation" class="confirmation">Thank you! We will respond within 48 hours.</div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-4" style="background-color: #4A148C; color: white;">
    <p>&copy; 2025 BizCare Connect Solution, LLC. All Rights Reserved.</p>
    <div class="social-icons mt-2">
      <a href="#"><i class="fab fa-facebook"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
    </div>
  
  </footer>

  <!-- Inline JS for Confirmation -->
  <script>
    document.getElementById("contact-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const form = e.target;

      fetch(form.action, {
        method: "POST",
        body: new FormData(form),
        headers: {
          Accept: "application/json"
        }
      }).then(response => {
        if (response.ok) {
          form.reset();
          document.getElementById("form-confirmation").style.display = "block";
        }
      });
    });
  </script>
</body>
</html>
