<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Sign-Up - BizCare Connect</title>
  <meta name="description" content="Login or Sign Up to access BizCare Connect's platform." />

  <!-- External CSS -->
  <link rel="stylesheet" href="style/style.css" />

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body {
      background-color: #f3e5f5;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Watermark */
    body::before {
      content: "";
      background-image: url("images/vin-logo.png");
      background-size: 80%;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.3;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .auth-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 80px 20px;
      flex-wrap: wrap;
      z-index: 1;
      position: relative;
    }

    .auth-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      animation: fadeIn 1.2s ease;
    }

    .auth-box h2 {
      text-align: center;
      color: #4A148C;
      margin-bottom: 25px;
    }

    .btn-purple {
      background-color: #4A148C;
      color: white;
      font-weight: bold;
    }

    .btn-purple:hover {
      background-color: #6a1b9a;
    }

    .btn-gold {
      background-color: #fbc02d;
      color: #4A148C;
      font-weight: bold;
    }

    .btn-gold:hover {
      background-color: #f9a825;
    }

    .confirmation {
      text-align: center;
      color: green;
      font-weight: bold;
      display: none;
      margin-top: 15px;
      animation: slideUp 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <header class="navbar sticky-top" style="background-color: #4A148C;">
    <div class="container d-flex justify-content-center align-items-center py-2">
      <nav>
        <ul class="nav">
          <li class="nav-item"><a class="nav-link text-white" href="index.html"><i class="fas fa-home"></i> Home</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="services.html"><i class="fas fa-clipboard-list"></i> Services</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="pricing.html"><i class="fas fa-tags"></i> Pricing</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="howitworks.html"><i class="fas fa-cogs"></i> How It Works</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="aboutus.html"><i class="fas fa-users"></i> About Us</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="blog.html"><i class="fas fa-blog"></i> Blog</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="contactus.html"><i class="fas fa-envelope"></i> Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Login & Sign-Up Cards -->
  <section class="auth-container">
    <!-- Login -->
    <div class="auth-box">
      <h2><i class="fas fa-lock"></i> Member Login</h2>
      <form class="login-form" action="https://formspree.io/f/xnnpjdyq" method="POST">
        <div class="mb-3">
          <label>Email</label>
          <input type="email" name="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-purple w-100">Login</button>
        <div class="confirmation login-confirm">Thank you! Login submitted.</div>
      </form>
    </div>

    <!-- Sign Up -->
    <div class="auth-box">
      <h2><i class="fas fa-user-plus"></i> Create Account</h2>
      <form class="signup-form" action="https://formspree.io/f/xnnpjdyq" method="POST">
        <div class="mb-3">
          <label>Full Name</label>
          <input type="text" name="name" class="form-control" required />
        </div>
        <div class="mb-3">
          <label>Email</label>
          <input type="email" name="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label>Create Password</label>
          <input type="password" name="password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-gold w-100">Create Account</button>
        <div class="confirmation signup-confirm">Account request submitted. Check your email!</div>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-4" style="background-color: #4A148C; color: white;">
    <p>&copy; 2025 BizCare Connect Solution, LLC. All Rights Reserved.</p>
    <div class="social-icons mt-2">
      <a href="#"><i class="fab fa-facebook"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
    </div>
  
  </footer>

  <!-- jQuery Form Submission -->
  <script>
    $(".login-form").on("submit", function(e) {
      e.preventDefault();
      const form = $(this);
      $.ajax({
        url: form.attr("action"),
        method: "POST",
        data: form.serialize(),
        dataType: "json",
        success: function() {
          form[0].reset();
          form.find(".login-confirm").fadeIn();
        }
      });
    });

    $(".signup-form").on("submit", function(e) {
      e.preventDefault();
      const form = $(this);
      $.ajax({
        url: form.attr("action"),
        method: "POST",
        data: form.serialize(),
        dataType: "json",
        success: function() {
          form[0].reset();
          form.find(".signup-confirm").fadeIn();
        }
      });
    });
  </script>

</body>
</html>
